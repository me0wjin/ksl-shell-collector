# ======================================
# KSL Shell Collector Settings
# ======================================

# 단어별 최대 수집 개수
MAX_SAMPLES_PER_WORD=5

# 기본 녹화 시간, 초 단위
DEFAULT_RECORD_SECONDS=8

# 녹화 시작 전 준비 카운트다운 시간, 초 단위
RECORD_COUNTDOWN_SECONDS=3

# 카메라 창이 뜨고 사용자가 화면을 인지할 준비 시간, 초 단위
CAMERA_WARMUP_SECONDS=3

# 실행 전 요구되는 최소 여유 메모리, MB 단위
MIN_FREE_MEMORY_MB=1000

# 실행 전 요구되는 최소 여유 디스크 공간, MB 단위
MIN_FREE_DISK_MB=1000

# CPU 사용률 경고 기준, % 단위
# 이 값 이상이면 실행은 계속하되 경고를 출력한다.
MAX_CPU_USAGE_PERCENT=85

# 사용자용 최종 데이터셋 저장 폴더
# 구조: data/dataset/수어종류/trial_회차_날짜시간/
SESSION_ROOT="data/dataset"

# 상세 출력 여부
# 0: 사용자 화면에는 요약 중심
# 1: 상세 정보도 화면 출력
VERBOSE_MODE=0
